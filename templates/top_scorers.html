<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artilheiros</title>

    <!-- Fonte Poppins 400 Regular -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/top_scores.css') }}">
</head>
<body class="bg-light font-poppins">

    <div class="container py-5">
        <!-- Título da Página -->
        <div class="text-center mb-4">
            <h1 class="display-4 text-primary">Artilheiros</h1>
            <p class="lead">Confira os jogadores com mais gols na competição</p>
        </div>

        <!-- Lista de Artilheiros -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jogador</th>
                        <th>Time</th>
                        <th>Gols</th>
                    </tr>
                </thead>
                <tbody>
                    {% for player in players %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td><strong>{{ player.name }}</strong></td>
                        <td>{{ player.team.name }}</td>
                        <td>{{ player.goals }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Botão de Voltar -->
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>
    </div>

    <!-- Scripts do Bootstrap -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
