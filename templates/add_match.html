<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Partida</title>

    <!-- Importação da Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Custom -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

<!-- Formulário de Adicionar Partida -->
<div class="container mt-5">
    <div class="form-card">
        <!-- Logo pequeno dentro do formulário -->
        <div class="text-center mb-4">
            <img src="../static/logos/logo-tf.jpg" alt="Logo Futsal" class="form-logo mb-3">
        </div>

        <!-- Título do formulário -->
        <h2 class="text-center mb-4">Adicionar Resultado da Partida</h2>
        
        <form method="POST">
            {{ form.hidden_tag() }}  <!-- Para CSRF -->

            <!-- Seleção do time A -->
            <div class="mb-4">
                <label for="team_a_id" class="form-label">{{ form.team_a_id.label }}</label>
                {{ form.team_a_id(class="form-control") }}
            </div>

            <!-- Seleção do time B -->
            <div class="mb-4">
                <label for="team_b_id" class="form-label">{{ form.team_b_id.label }}</label>
                {{ form.team_b_id(class="form-control") }}
            </div>

            <!-- Seleção da Fase -->
            <div class="mb-4">
                <label for="phase" class="form-label">{{ form.phase.label }}</label>
                {{ form.phase(class="form-control") }}
            </div>

            <!-- Botão de envio -->
            <div class="d-flex justify-content-center">
                {{ form.submit(class="btn btn-danger btn-lg w-100") }}
            </div>
        </form>

        <!-- Botão Voltar -->
        <div class="d-flex justify-content-center mt-3">
            <a href="{{ url_for('index') }}" class="btn btn-secondary w-100">Voltar</a>
        </div>
    </div>
</div>

</body>
</html>
