<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Copa Terça Féra</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- CSS Custom -->
  <link rel="stylesheet" href="../static/css/index.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header text-center py-5">
    <img src="../static/logos/logo2025.png" alt="Logo Futsal" class="logo mb-3">
    <h1>Super Copa dos Campeões Terça Féra</h1>
  </header>

  <!-- Conteúdo -->
  <main class="container my-5">
    <div class="row g-4 justify-content-center">
      
      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('add_team') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Adicionar Time</h5>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('add_player') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Adicionar Jogador</h5>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('add_match') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Adicionar Partida</h5>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('standings') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Tabela de Classificação</h5>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('players') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Jogadores</h5>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('top_scorers') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Artilheiros</h5>
            </div>
          </div>
        </a>
      </div>

      <div class="col-md-4 col-lg-3">
        <a href="{{ url_for('matches') }}" class="menu-card text-decoration-none">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">Lista de Jogos</h5>
            </div>
          </div>
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer text-center py-3 mt-auto">
    &copy; 2025 Sistema de Futsal. Todos os direitos reservados.
  </footer>

</body>
</html>
