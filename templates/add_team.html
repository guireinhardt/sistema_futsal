<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Time</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts Poppins Extra Light -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    
    <!-- CSS externo -->
    <link rel="stylesheet" href="../static/css/add_team.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card form-card shadow-lg">
        <div class="card-body text-center">
            <!-- Logo central -->
            <img src="../static/logos/logo-tf.jpg" alt="Logo Futsal" class="form-logo mb-3">

            <h2 class="card-title mb-4">Adicionar Novo Time</h2>

            <!-- Formulário -->
            <form method="POST" class="text-start">
                {{ form.hidden_tag() }}

                <div class="mb-3">
                    {{ form.name.label(class="form-label") }}
                    {{ form.name(class="form-control", placeholder="Nome do Time") }}
                </div>

                <div class="d-grid">
                    {{ form.submit(class="btn btn-danger btn-lg") }}
                </div>
            </form>

            <div class="mt-3">
                <a href="{{ url_for('index') }}" class="text-decoration-none text-primary">Voltar</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
