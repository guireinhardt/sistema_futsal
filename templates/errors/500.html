<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro no servidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; color: #201f57; }
        .error-box { max-width: 480px; margin: 6rem auto; text-align: center; }
        .error-code { font-size: 4rem; font-weight: 600; color: #af1411; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-box">
            <div class="error-code">500</div>
            <p class="lead">Algo deu errado do nosso lado. Tente novamente em instantes.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Voltar para o início</a>
        </div>
    </div>
</body>
</html>
