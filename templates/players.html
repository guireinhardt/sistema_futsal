<!doctype html>
<html>
<head>
    <title>Lista de Jogadores</title>
</head>
<body>
    <h1>Lista de Jogadores</h1>
    <table>
        <tr>
            <th>Nome do Jogador</th>
            <th>Time</th>
            <th>Gols</th>
        </tr>
        {% for player in players %}
        <tr>
            <td>{{ player.name }}</td>
            <td>{{ player.team.name }}</td>
            <td>{{ player.position }}</td>  <!-- Mostra a posição do jogador -->
            <td>{{ player.goals }}</td>
            <td><a href="{{ url_for('edit_player', player_id=player.id) }}">Editar</a></td>
        </tr>
        
        {% endfor %}
    </table>
    <a href="{{ url_for('index') }}">Voltar</a>
</body>
</html>
