<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Jogadores</title>

    <!-- Fonte Poppins 400 Regular do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/player.css') }}">
</head>
<body class="bg-light font-poppins">

    <div class="container py-5">
        <!-- Título da Página -->
        <div class="text-center mb-4">
            <h1 class="display-4 text-primary">Lista de Jogadores</h1>
            <p class="lead">Confira os jogadores por time e suas respectivas estatísticas</p>
        </div>

        <!-- Cards de Times e Jogadores -->
        <div class="row">
            {% for team in teams %}
            <div class="col-md-4 mb-4">
                <!-- Card para cada time -->
                <div class="card shadow-sm">
                    <div class="card-header text-center">
                        <img src="{{ url_for('static', filename='logos/' + team.logo_filename) }}" alt="{{ team.name }}" class="img-fluid" style="width: 60px; height: 60px; border-radius: 50%;">

                        <h5 class="mt-2">{{ team.name }}</h5>
                    </div>
                    <div class="card-body">
                        <h6 class="card-title text-center">Jogadores</h6>
                        <ul class="list-group list-group-flush">
                            {% for player in team.players %}
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>{{ player.name }}</strong><br>
                                    <small>{{ player.position }}</small>
                                </div>
                                <a href="{{ url_for('edit_player', player_id=player.id) }}" class="btn btn-warning btn-sm ms-2">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Botão de Voltar -->
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>
    </div>

    <!-- Scripts do Bootstrap -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
